# fly.io: the one gather bot. README.md walks through the first deploy; in short:
#   fly launch --no-deploy --copy-config --name soldatreloaded-bot     (once)
#   fly secrets set GATHER_DISCORD_TOKEN=... GATHER_SECRET=...
#   fly deploy
# The bot talks to Discord outbound; the HTTP service is for the game servers' scripts.
app = "soldatreloaded-bot"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  GATHER_LISTEN = ":8080"
  # the channels the bot lives in (one gather, announced in all), and the servers it
  # runs: name=host:port; both space-separated
  GATHER_CHANNEL_ID = "1555216517673779221 1555278127331020933"
  GATHER_SERVERS = "eu=soldatreloaded-eu.fly.dev:23073"
  GATHER_PREFIX = "!test_"
  GATHER_TEAM_SIZE = "3"
  # who may have every server's password DM'd (the passwords command): Discord user IDs
  GATHER_ADMIN_IDS = "511603215591276584"
  # GATHER_DISCORD_TOKEN and GATHER_SECRET are secrets: fly secrets set ...

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"   # the bot must stay up to hear Discord
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
